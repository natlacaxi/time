name: Vérification

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: manifest.json valide
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: JavaScript de la page valide
        run: node -e "const h=require('fs').readFileSync('index.html','utf8');new Function(h.match(/<script>([\s\S]*)<\/script>/)[1])"
      - name: Fichiers PWA présents
        run: |
          for f in index.html manifest.json sw.js favicon.svg favicon.ico icon-192.png icon-512.png maskable-512.png; do
            test -f "$f" || { echo "Fichier manquant : $f"; exit 1; }
          done
