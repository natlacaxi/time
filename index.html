<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TalcoTime</title>
<meta name="description" content="Crée tes horloges du monde entier : couleurs, styles, zoom.">
<meta name="theme-color" content="#07041a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TalcoTime">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--z:1;--b1:#7c3aed;--b2:#06b6d4;--b3:#ec4899;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#07041a;color:#fff;min-height:100dvh;overflow-x:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body[data-t=nuit]{--b1:#4338ca;--b2:#0ea5e9;--b3:#14b8a6}
body[data-t=sunset]{--b1:#f97316;--b2:#ec4899;--b3:#8b5cf6}
body[data-t=foret]{--b1:#10b981;--b2:#84cc16;--b3:#0ea5e9}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.5;animation:fl 20s ease-in-out infinite alternate;transition:background 1s}
.bg i:nth-child(1){background:var(--b1);left:-20vmax;top:-20vmax}
.bg i:nth-child(2){background:var(--b2);right:-25vmax;top:8vmax;animation-delay:-7s}
.bg i:nth-child(3){background:var(--b3);left:15vw;bottom:-30vmax;animation-delay:-13s}
.bg::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff9,transparent),radial-gradient(1px 1px at 90px 120px,#fff7,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff8,transparent);background-size:200px 160px;animation:tw 4s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate(10vmax,8vmax) scale(1.25) rotate(50deg)}}
@keyframes tw{from{opacity:.25}to{opacity:.8}}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding:28px clamp(16px,4vw,48px) 8px}
h1{font-size:clamp(2.4rem,8vw,4.6rem);font-weight:900;letter-spacing:-.04em;line-height:1;background:linear-gradient(90deg,#fff,var(--b2),var(--b3),#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 8s linear infinite}
h1 span{font-weight:300}
@keyframes sh{to{background-position:-300% 0}}
#loc{text-align:right}
#loc .t{font-size:clamp(1.8rem,6vw,3rem);font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:.02em}
#loc .d{opacity:.65;font-size:.95rem;text-transform:capitalize}
.bar{position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px clamp(12px,3vw,40px);padding:10px 12px;border-radius:22px;background:#150f3399;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #ffffff22}
.bar input[type=text]{flex:1 1 220px;min-width:0;padding:11px 16px;border-radius:14px;border:1px solid #ffffff2e;background:#ffffff14;color:#fff;font-size:1rem;outline:none;transition:.2s}
.bar input[type=text]:focus,#dlg input[type=text]:focus{border-color:var(--b2);box-shadow:0 0 0 3px #06b6d444}
.b{padding:10px 16px;border-radius:14px;border:1px solid #ffffff2e;background:#ffffff14;color:#fff;font-size:.95rem;cursor:pointer;transition:.2s;font-family:inherit}
.b:hover{background:#ffffff2b;transform:translateY(-2px)}
.b.main{background:linear-gradient(135deg,var(--b1),var(--b3));border:0;font-weight:700}
.zm{display:flex;align-items:center;gap:8px}
input[type=range]{accent-color:var(--b3);width:110px}
.th{display:flex;gap:6px}
.th button{width:26px;height:26px;border-radius:50%;border:2px solid #fff5;cursor:pointer;transition:.2s}
.th button:hover,.th button.on{transform:scale(1.25);border-color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(250px*var(--z))),1fr));gap:calc(18px*var(--z));padding:12px clamp(12px,3vw,40px) 60px}
.card{--c:#a78bfa;container-type:inline-size;position:relative;isolation:isolate;border-radius:28px;padding:6cqw;display:flex;flex-direction:column;align-items:center;gap:2cqw;overflow:hidden;background:linear-gradient(145deg,#ffffff1f,#ffffff08);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 14px 44px -14px color-mix(in srgb,var(--c) 70%,transparent);transform:perspective(800px) rotateX(var(--rx,0)) rotateY(var(--ry,0));transition:transform .25s ease-out,box-shadow .3s}
.card.pop{animation:pop .8s cubic-bezier(.2,1.5,.4,1) backwards;animation-delay:calc(var(--i)*80ms)}
.card.out{transition:.3s;opacity:0;transform:scale(.6) rotate(-6deg)}
.card.drag{opacity:.4}
.card::before{content:"";position:absolute;inset:-60%;z-index:-2;background:conic-gradient(from 0deg,transparent 65%,var(--c));animation:sp 6s linear infinite;opacity:.55}
.card::after{content:"";position:absolute;inset:1.5px;z-index:-1;border-radius:27px;background:#0e0a28f0}
.card.night::after{background:#070520f5}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.7) rotate(-5deg)}}
.name{font-size:7.5cqw;font-weight:800;text-align:center;max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub,.date{font-size:4.6cqw;opacity:.7;text-align:center;text-transform:capitalize}
.date{opacity:.85}
.face{width:100%;display:flex;justify-content:center;padding-block:2cqw}
.an{width:100%;display:block}
.an .sh{filter:drop-shadow(0 0 4px var(--c))}
.time{font-size:18cqw;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap;letter-spacing:-.02em}
.time small{font-size:.42em;font-weight:600;opacity:.8;margin-left:.1em}
.time b{animation:bl 1s steps(2) infinite;font-weight:300}
@keyframes bl{50%{opacity:.2}}
.dg .time{background:linear-gradient(180deg,#fff 20%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.neon .time{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;color:#fff;text-shadow:0 0 .06em #fff,0 0 .2em var(--c),0 0 .5em var(--c),0 0 1em var(--c);animation:fk 6s infinite}
@keyframes fk{0%,92%,96%,100%{opacity:1}94%{opacity:.55}98%{opacity:.8}}
.rg{position:relative;width:86%;aspect-ratio:1}
.rg svg{width:100%;height:100%;display:block}
.rg .tr{fill:none;stroke:#ffffff1a;stroke-width:10}
.rg .pr{fill:none;stroke:var(--c);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 6px var(--c))}
.rg .time{position:absolute;inset:0;display:grid;place-items:center;font-size:17cqw}
.acts{position:absolute;top:3cqw;right:3cqw;display:flex;gap:6px;z-index:3}
.acts button{width:clamp(28px,9cqw,40px);height:clamp(28px,9cqw,40px);border-radius:50%;border:0;background:#ffffff1f;color:#fff;cursor:pointer;font-size:clamp(13px,4.6cqw,18px);transition:.2s}
.acts button:hover{background:var(--c);transform:rotate(15deg) scale(1.1)}
@media(hover:hover){.acts{opacity:0;transition:.2s}.card:hover .acts{opacity:1}}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;opacity:.7;font-size:1.2rem}
dialog{margin:auto;width:min(94vw,460px);max-height:92dvh;overflow:auto;padding:22px;border-radius:26px;border:1px solid #ffffff2e;background:#150f33;color:#fff}
dialog[open]{animation:dg .35s cubic-bezier(.2,1.4,.4,1)}
dialog::backdrop{background:#000a;backdrop-filter:blur(8px)}
@keyframes dg{from{opacity:0;transform:scale(.8) translateY(30px)}}
dialog.shake{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
dialog h2{margin-bottom:14px}
dialog label{display:block;font-size:.9rem;opacity:.8;margin:14px 0 6px}
#dlg input[type=text]{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #ffffff2e;background:#ffffff14;color:#fff;font-size:1rem;outline:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip.on{background:linear-gradient(135deg,var(--b1),var(--b3));border-color:transparent}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;transition:.2s}
.sw.on,.sw:hover{border-color:#fff;transform:scale(1.2)}
input[type=color]{width:38px;height:32px;border:0;background:none;padding:0;cursor:pointer}
.ck{display:flex;align-items:center;gap:8px;margin:0!important;opacity:1!important;cursor:pointer}
.ck input{accent-color:var(--b3);width:18px;height:18px}
.foot{display:flex;gap:10px;margin-top:22px;justify-content:flex-end;flex-wrap:wrap}
.del{margin-right:auto;color:#fda4af}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation:none!important;transition:none!important}}
/* ===== v2 ===== */
.card{font-family:var(--f);border-radius:calc(var(--r)*1px);box-shadow:0 14px 44px -14px color-mix(in srgb,var(--c) calc(var(--g)*1%),transparent)}
.card::after{border-radius:max(0px,calc(var(--r)*1px - 1.5px))}
.card[data-bg=glass]::after{background:#0e0a28b8}
.card[data-bg=solid]::after{background:#0b0820}
.card[data-bg=grad]::after{background:linear-gradient(145deg,color-mix(in srgb,var(--c) 38%,#0b0820),color-mix(in srgb,var(--c2) 38%,#0b0820))}
.card[data-bg=clear]::after{background:transparent}
.card[data-bg=clear]::before,.card[data-bd=none]::before{display:none}
.card[data-bg=clear]{box-shadow:none;border:1px solid #ffffff1f;backdrop-filter:none}
.card[data-bd=still]::before{animation:none;transform:none;inset:0;background:linear-gradient(135deg,var(--c),var(--c2));opacity:.85}
@media(min-width:640px){.card[data-sp="2"]{grid-column:span 2}}
#grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,calc(250px*var(--z)*var(--w,1))),1fr));gap:calc(18px*var(--z)*var(--d,1))}
.nobg .bg i,.nobg .bg::after{animation:none}
.dg .time{background:linear-gradient(135deg,#fff 0%,var(--c) 50%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.neon .time{font-family:inherit;text-shadow:0 0 .06em #fff,0 0 .2em color-mix(in srgb,var(--c) calc(var(--g)*1%),transparent),0 0 .5em color-mix(in srgb,var(--c) calc(var(--g)*1%),transparent),0 0 1em color-mix(in srgb,var(--c2) calc(var(--g)*1%),transparent)}
.an .sh{filter:drop-shadow(0 0 4px color-mix(in srgb,var(--c2) calc(var(--g)*1%),transparent))}
.rg .pr{stroke-linecap:round;filter:drop-shadow(0 0 5px color-mix(in srgb,var(--c) calc(var(--g)*1%),transparent))}
.rg .tr{stroke:#ffffff1a}
.rg .time{font-size:14cqw}
.time.sm{font-size:9cqw;opacity:.75;font-weight:600}
.st-bars .face,.st-words .face{flex-direction:column;align-items:center;gap:2cqw}
.wd{font-size:9.5cqw;font-weight:700;line-height:1.2;text-align:center;padding:2cqw;text-wrap:balance;background:linear-gradient(135deg,#fff,var(--c) 60%,var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
.bars{width:100%;display:grid;gap:3.2cqw;padding:3cqw 2cqw 0}
.bar{display:grid;grid-template-columns:22cqw 1fr;align-items:center;gap:3cqw;font-size:4.6cqw;opacity:.9}
.bar u{display:block;height:3.4cqw;border-radius:9px;background:#ffffff1c;overflow:hidden}
.bar s{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--c),var(--c2));box-shadow:0 0 12px color-mix(in srgb,var(--c) calc(var(--g)*1%),transparent)}
.st-bars .time{font-size:15cqw}
.note{font-size:4.6cqw;opacity:.6;font-style:italic;text-align:center}
.note:empty{display:none}
.star{position:absolute;top:3cqw;left:3cqw;z-index:3;width:clamp(28px,9cqw,40px);height:clamp(28px,9cqw,40px);border-radius:50%;border:0;background:#ffffff1f;color:#fff8;cursor:pointer;font-size:clamp(14px,5cqw,20px);transition:.2s}
.star.on{color:#facc15;background:#facc1526;text-shadow:0 0 10px #facc15}
.star:hover{transform:scale(1.2) rotate(-10deg)}
@media(hover:hover){.star:not(.on){opacity:0}.card:hover .star{opacity:1}}
.b[aria-pressed=true]{background:#facc1533;border-color:#facc15;color:#fde68a}
.cnt{opacity:.55;font-size:.85rem;padding:0 4px}
dialog input[type=text],dialog select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid #ffffff2e;background:#ffffff14;color:#fff;font-size:1rem;outline:none;font-family:inherit}
dialog select{background:#241a52}
.row input[type=text]{flex:1 1 180px;width:auto}
#dlg{width:min(96vw,560px)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.pv{position:sticky;top:-22px;z-index:6;padding:8px 0 10px;background:linear-gradient(#150f33 85%,transparent);display:flex;justify-content:center}
.pv .card{width:min(62%,230px)}
#gal{width:min(96vw,980px)}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.gg .card{cursor:pointer}
.tabs{margin-top:12px}
#set .th{flex-wrap:wrap}
#toast{position:fixed;inset:auto;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);margin:0;border:0;padding:12px 20px;border-radius:16px;background:#241a52;color:#fff;box-shadow:0 10px 40px #000a;font-size:.95rem}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<header>
  <h1>Talco<span>Time</span></h1>
  <div id="loc"><div class="t"></div><div class="d"></div></div>
</header>
<nav class="bar">
  <input id="f" type="text" placeholder="🔎 Chercher dans mes horloges…" autocomplete="off" enterkeyhint="search">
  <input id="q" type="text" list="cl" placeholder="＋ Ajouter une ville (Tokyo, Dakar…)" autocomplete="off" enterkeyhint="done">
  <button class="b main" id="add">＋ Personnalisée</button>
  <button class="b" id="mod">🎨 Modèles</button>
  <button class="b" id="favf" aria-pressed="false">★ Favoris</button>
  <label class="zm" title="Zoom (+ / −)">🔍<input type="range" id="zoom" min=".6" max="2.2" step=".05" value="1" aria-label="Zoom"></label>
  <span class="cnt" id="cnt"></span>
  <button class="b" id="cfg" title="Réglages">⚙</button>
  <button class="b" id="fs" title="Plein écran">⛶</button>
  <button class="b" id="inst" hidden>⤓ Installer</button>
</nav>
<main id="grid"></main>
<datalist id="cl"></datalist>

<dialog id="dlg"></dialog>
<dialog id="gal">
  <div class="gh"><h2>🎨 Modèles</h2><button class="b" id="gx" aria-label="Fermer">✕</button></div>
  <div class="row"><input id="gs" type="text" placeholder="🔎 Chercher un modèle (néon, rétro, gare…)" autocomplete="off"><input id="gc" type="text" list="cl" placeholder="Ville du nouveau modèle (vide = chez moi)" autocomplete="off"></div>
  <div class="row tabs" id="gt"><button class="b chip on" data-t="all">Tous</button><button class="b chip" data-t="fav">★ Favoris</button><button class="b chip" data-t="mine">Mes modèles</button></div>
  <div class="gg" id="gg"></div>
</dialog>
<dialog id="set">
  <h2>⚙ Réglages</h2>
  <label>Thème du fond</label><div class="row th" id="ths"></div>
  <div class="fg">
    <div><label for="s_dens">Densité</label><select id="s_dens"><option value="compact">Compacte</option><option value="normal">Normale</option><option value="airy">Aérée</option></select></div>
    <div><label for="s_sort">Tri</label><select id="s_sort"><option value="manual">Manuel (glisser)</option><option value="name">Nom A→Z</option><option value="time">Fuseau</option><option value="fav">Favoris d’abord</option></select></div>
    <div><label for="s_defStyle">Style des nouvelles</label><select id="s_defStyle"></select></div>
    <div><label for="s_def24">Format des nouvelles</label><select id="s_def24"><option value="1">24 h</option><option value="0">12 h</option></select></div>
  </div>
  <label>Application</label>
  <div class="row">
    <label class="ck"><input type="checkbox" id="s_bg"> Fond animé</label>
    <label class="ck"><input type="checkbox" id="s_head"> Heure en en-tête</label>
    <label class="ck"><input type="checkbox" id="s_favicon"> Favicon animé</label>
    <label class="ck"><input type="checkbox" id="s_title"> Heure dans l’onglet</label>
  </div>
  <label>Pour toutes les horloges</label>
  <div class="row"><button class="b" id="b24">24 h</button><button class="b" id="b12">12 h</button><button class="b" id="bsec">Secondes ±</button><button class="b" id="bdate">Date ±</button><select id="b_style" style="width:auto"></select></div>
  <label>Sauvegarde</label>
  <div class="row"><button class="b" id="bexp">⤓ Exporter</button><button class="b" id="bimp">⤒ Importer</button><button class="b del" id="breset">Tout réinitialiser</button></div>
  <div class="foot"><button class="b main" id="sx">Fermer</button></div>
</dialog>
<div id="toast" popover="manual"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
const $=s=>document.querySelector(s),LANG='fr-FR',KEY='talcotime.v1';
const CITIES=[["Paris","Europe/Paris"],["Londres","Europe/London"],["New York","America/New_York"],["Tokyo","Asia/Tokyo"],["Sydney","Australia/Sydney"],["Dubaï","Asia/Dubai"],["Los Angeles","America/Los_Angeles"],["Chicago","America/Chicago"],["Mexico","America/Mexico_City"],["São Paulo","America/Sao_Paulo"],["Buenos Aires","America/Argentina/Buenos_Aires"],["Montréal","America/Toronto"],["Vancouver","America/Vancouver"],["Reykjavik","Atlantic/Reykjavik"],["Lisbonne","Europe/Lisbon"],["Madrid","Europe/Madrid"],["Berlin","Europe/Berlin"],["Rome","Europe/Rome"],["Athènes","Europe/Athens"],["Istanbul","Europe/Istanbul"],["Moscou","Europe/Moscow"],["Le Caire","Africa/Cairo"],["Lagos","Africa/Lagos"],["Nairobi","Africa/Nairobi"],["Johannesburg","Africa/Johannesburg"],["Casablanca","Africa/Casablanca"],["Dakar","Africa/Dakar"],["Abidjan","Africa/Abidjan"],["Riyad","Asia/Riyadh"],["Téhéran","Asia/Tehran"],["Karachi","Asia/Karachi"],["Delhi","Asia/Kolkata"],["Dacca","Asia/Dhaka"],["Bangkok","Asia/Bangkok"],["Jakarta","Asia/Jakarta"],["Singapour","Asia/Singapore"],["Hong Kong","Asia/Hong_Kong"],["Shanghai","Asia/Shanghai"],["Séoul","Asia/Seoul"],["Manille","Asia/Manila"],["Perth","Australia/Perth"],["Auckland","Pacific/Auckland"],["Honolulu","Pacific/Honolulu"],["Anchorage","America/Anchorage"],["Denver","America/Denver"],["Lima","America/Lima"],["Bogota","America/Bogota"],["La Havane","America/Havana"],["Papeete","Pacific/Tahiti"],["Nouméa","Pacific/Noumea"],["La Réunion","Indian/Reunion"],["Fort-de-France","America/Martinique"],["Cayenne","America/Cayenne"]];
const COLORS=['#a78bfa','#22d3ee','#f472b6','#facc15','#34d399','#fb923c','#60a5fa','#f87171'];
const LOCAL=Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC';
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const label=tz=>{const c=CITIES.find(x=>x[1]===tz);return c?`${c[0]} (${tz})`:tz};
const uid=()=>Math.random().toString(36).slice(2,9);
const FONTS={sans:'system-ui,-apple-system,"Segoe UI",Roboto,sans-serif',mono:'ui-monospace,"SF Mono",Menlo,Consolas,monospace',serif:'ui-serif,Georgia,"Times New Roman",serif',round:'ui-rounded,"SF Pro Rounded","Varela Round",Nunito,system-ui,sans-serif',cond:'"Arial Narrow","Roboto Condensed",Oswald,"Helvetica Neue",sans-serif',disp:'Impact,"Arial Black","Helvetica Neue",sans-serif'};
const DEF={style:'analog',color:'#a78bfa',color2:'#f472b6',font:'sans',glow:60,bg:'glass',border:'spin',radius:28,h24:true,sec:true,date:true,sub:true,icon:true,ticks:'lines',nums:'none',hands:'classic',smooth:true,span:1,note:'',fav:false};
const LOOK=Object.keys(DEF).filter(k=>k!=='note'&&k!=='fav');
const STYLES=[['analog','🕰️ Analogique'],['digital','🔢 Digital'],['ring','⭕ Anneaux'],['neon','💡 Néon'],['bars','📊 Barres'],['words','💬 En lettres']];

function txt(c,p){const h=c.h24?p2(p.h):(p.h%12||12);
 return`${h}<b>:</b>${p2(p.m)}${c.sec?`<small>:${p2(p.s)}</small>`:''}${c.h24?'':`<small>${p.h<12?'AM':'PM'}</small>`}`}
const LBL={5:'cinq',10:'dix',20:'vingt',25:'vingt-cinq'};
function words(h,m){let r=Math.round(m/5)*5;if(r===60){h++;r=0}h%=24;
 const H=x=>{x%=24;return x===0?'minuit':x===12?'midi':(x%12===1?'une heure':['','','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze'][x%12]+' heures')};
 let t;if(r===0)t=H(h);else if(r===15)t=H(h)+' et quart';else if(r===30)t=H(h)+(h%12===0?' et demi':' et demie');else if(r<30)t=H(h)+' '+LBL[r];else if(r===45)t=H(h+1)+' moins le quart';else t=H(h+1)+' moins '+LBL[60-r];

grid.ondragend=()=>{dragId=null;grid.querySelectorAll('.drag').forEach(k=>k.classList.remove('drag'))};
grid.onpointermove=e=>{if(e.pointerType!=='mouse')return;const k=e.target.closest('.card');if(!k)return;const r=k.getBoundingClientRect();
 k.style.setProperty('--ry',((e.clientX-r.left)/r.width-.5)*12+'deg');k.style.setProperty('--rx',-((e.clientY-r.top)/r.height-.5)*12+'deg')};
grid.onmouseout=e=>{const k=e.target.closest('.card');if(k&&!k.contains(e.relatedTarget)){k.style.setProperty('--rx','0deg');k.style.setProperty('--ry','0deg')}};

/* éditeur */
const dlg=$('#dlg');let ed=null,sty='analog',gmode='add',tab='all';
const selH=k=>`<div><label for="f_${k}">${SEL[k][0]}</label><select id="f_${k}">${SEL[k][1].map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}</select></div>`;
dlg.innerHTML=`<h2 id="dh"></h2><div class="pv" id="pv"></div>
<div class="row"><button class="b" id="dmod">🎨 Modèles</button><button class="b" id="drnd">🎲 Surprends-moi</button></div>
<label for="dc">Ville ou fuseau horaire</label><input id="dc" type="text" list="cl" autocomplete="off" placeholder="Tokyo, Asia/Tokyo…">
<div class="fg"><div><label for="dn">Nom affiché</label><input id="dn" type="text" maxlength="28" placeholder="Ex. Chez mamie"></div><div><label for="dno">Note</label><input id="dno" type="text" maxlength="40" placeholder="Ex. Papy 👴"></div></div>
<label>Affichage</label><div class="row" id="styles">${STYLES.map(([v,t])=>`<button class="b chip" data-s="${v}">${t}</button>`).join('')}</div>
<label>Couleurs (1 et 2)</label><div class="row" id="cols">${COLORS.map(c=>`<button class="sw" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}<input type="color" id="f_color" aria-label="Couleur 1"><input type="color" id="f_color2" aria-label="Couleur 2"></div>
<div class="fg">${Object.keys(SEL).map(selH).join('')}</div>
<div class="fg">${Object.entries(RNG).map(([k,[t,a,b]])=>`<div><label for="f_${k}">${t}</label><input type="range" id="f_${k}" min="${a}" max="${b}" style="width:100%"></div>`).join('')}</div>
<label>Options</label><div class="row">${Object.entries(CHK).map(([k,t])=>`<label class="ck"><input type="checkbox" id="f_${k}"> ${t}</label>`).join('')}</div>
<div class="foot"><button class="b del" id="del">🗑 Supprimer</button><button class="b" id="dsave">💾 En modèle</button><button class="b" id="no">Annuler</button><button class="b main" id="ok">Enregistrer</button></div>`;
const hi=()=>document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.c===$('#f_color').value));
function pickSty(s){sty=s;document.querySelectorAll('#styles .chip').forEach(b=>b.classList.toggle('on',b.dataset.s===s))}
function setForm(c){$('#dn').value=c.name||'';$('#dno').value=c.note||'';pickSty(c.style);
 for(const k in SEL)$('#f_'+k).value=c[k];for(const k in RNG)$('#f_'+k).value=c[k];for(const k in CHK)$('#f_'+k).checked=!!c[k];
 $('#f_color').value=c.color;$('#f_color2').value=c.color2;hi()}
function getForm(){const o={name:$('#dn').value.trim(),note:$('#dno').value.trim(),style:sty,color:$('#f_color').value,color2:$('#f_color2').value};
 for(const k in SEL)o[k]=k==='span'?+$('#f_'+k).value:$('#f_'+k).value;
 for(const k in RNG)o[k]=+$('#f_'+k).value;for(const k in CHK)o[k]=$('#f_'+k).checked;return o}
function pvR(){const f=getForm(),r=resolve($('#dc').value),c={...DEF,...f,id:'pv',tz:r?r.tz:LOCAL,name:f.name||(r?r.name:'Aperçu')};
 const e=buildCard(c,'pv');e.dataset.sp=1;$('#pv').replaceChildren(e);live.set('pv',{c,e})}
dlg.addEventListener('input',pvR);dlg.addEventListener('change',pvR);
dlg.onclose=()=>live.delete('pv');
$('#cols').onclick=e=>{const b=e.target.closest('.sw');if(b){$('#f_color').value=b.dataset.c;hi();pvR()}};
$('#styles').onclick=e=>{const b=e.target.closest('.chip');if(b){pickSty(b.dataset.s);pvR()}};
$('#dn').oninput=()=>$('#dn').dataset.auto='0';
$('#dc').onchange=()=>{const r=resolve($('#dc').value);if(r){$('#dc').value=label(r.tz);if($('#dn').dataset.auto!=='0')$('#dn').value=r.name;pvR()}};
function openEd(id){ed=id?S.clocks.find(c=>c.id===id):null;
 const c=ed||mk('','',S.clocks.length,{h24:S.set.def24,style:S.set.defStyle});
 $('#dh').textContent=ed?'Modifier l’horloge':'Nouvelle horloge';
 $('#dc').value=ed?label(ed.tz):'';$('#dn').dataset.auto=ed?'0':'1';setForm(c);$('#del').hidden=!ed;pvR();dlg.showModal()}
$('#add').onclick=()=>openEd(null);
$('#no').onclick=()=>dlg.close();
$('#del').onclick=()=>{S.clocks=S.clocks.filter(c=>c.id!==ed.id);save();render();dlg.close()};
$('#ok').onclick=()=>{const r=resolve($('#dc').value);
 if(!r){dlg.classList.remove('shake');void dlg.offsetWidth;dlg.classList.add('shake');$('#dc').focus();return}
 const f=getForm();f.name=f.name||r.name;f.tz=r.tz;
 if(ed)Object.assign(ed,f);else S.clocks.push({...DEF,id:uid(),...f});
 save();render();dlg.close()};
$('#dsave').onclick=()=>{const f=getForm(),n=prompt('Nom du modèle ?',f.name||'Mon modèle');if(!n)return;
 const o={};LOOK.forEach(k=>o[k]=f[k]);S.models.push({id:'u'+uid(),n:n.slice(0,24),t:'mes modèles perso',o});save();toast(`💾 Modèle « ${n} » enregistré`)};
const pick=a=>a[Math.floor(Math.random()*a.length)],rn=(a,b)=>Math.round(a+Math.random()*(b-a));
const hx=(h,s=80,l=62)=>{l/=100;const a=s*Math.min(l,1-l)/100,f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))).toString(16).padStart(2,'0')};return'#'+f(0)+f(8)+f(4)};
$('#drnd').onclick=()=>{const h=rn(0,359);
 setForm({...DEF,...getForm(),style:pick(STYLES)[0],font:pick(Object.keys(FONTS)),bg:pick(['glass','solid','grad','clear']),border:pick(['spin','still','none']),ticks:pick(['lines','dots','none']),nums:pick(['none','arabic','roman']),hands:pick(['classic','thin','bold']),glow:rn(30,100),radius:rn(6,46),color:hx(h),color2:hx((h+rn(40,160))%360)});pvR()};

/* galerie de modèles */
const gal=$('#gal'),gg=$('#gg');
const allM=()=>[...PM.map(m=>({...m,u:0})),...S.models.map(m=>({...m,u:1}))];
function buildGal(){for(const k of[...live.keys()])if(k.startsWith('m:'))live.delete(k);
 const q=norm($('#gs').value);let L=allM();
 if(tab==='fav')L=L.filter(m=>S.fm.includes(m.id));if(tab==='mine')L=L.filter(m=>m.u);
 if(q)L=L.filter(m=>norm(m.n+' '+m.t).includes(q));
 gg.innerHTML='';
 if(!L.length){gg.innerHTML='<div class="empty" style="grid-column:1/-1">Rien ici pour l’instant.</div>';return}
 L.forEach(m=>{const c={...DEF,...m.o,id:'m:'+m.id,name:m.n,tz:LOCAL,_gal:1,_u:m.u,tags:m.t,fav:S.fm.includes(m.id)};
  const e=buildCard(c,'gal');e.dataset.mid=m.id;gg.appendChild(e);live.set(c.id,{c,e})})}
function openGal(mode){gmode=mode;$('#gc').hidden=mode==='apply';buildGal();gal.showModal()}
$('#mod').onclick=()=>openGal('add');$('#dmod').onclick=()=>openGal('apply');
$('#gx').onclick=()=>gal.close();
gal.onclose=()=>{for(const k of[...live.keys()])if(k.startsWith('m:'))live.delete(k)};
$('#gs').oninput=buildGal;
$('#gt').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;tab=b.dataset.t;document.querySelectorAll('#gt .chip').forEach(x=>x.classList.toggle('on',x===b));buildGal()};
function useModel(id){const m=allM().find(x=>x.id===id);if(!m)return;
 if(gmode==='apply'){setForm({...DEF,...getForm(),...m.o});pvR();gal.close();toast(`🎨 Modèle « ${m.n} » appliqué`)}
 else{const r=resolve($('#gc').value)||{name:'Chez moi',tz:LOCAL};S.clocks.push({...DEF,id:uid(),name:r.name,tz:r.tz,...m.o});save();render();gal.close();toast(`✔ « ${m.n} » ajouté`)}}
gg.onclick=e=>{const k=e.target.closest('.card');if(!k)return;const id=k.dataset.mid,b=e.target.closest('button[data-a]');
 if(b&&b.dataset.a==='mf'){const i=S.fm.indexOf(id);i<0?S.fm.push(id):S.fm.splice(i,1);save();if(tab==='fav')buildGal();else b.classList.toggle('on',i<0);return}
 if(b&&b.dataset.a==='md'){S.models=S.models.filter(m=>m.id!==id);S.fm=S.fm.filter(x=>x!==id);save();buildGal();return}
 useModel(id)};

/* réglages */
const st=$('#set');
$('#ths').innerHTML=Object.entries(THEMES).map(([k,v])=>`<button data-t="${k}" style="background:linear-gradient(135deg,${v[0]},${v[2]})" aria-label="${k}"></button>`).join('');
$('#ths').onclick=e=>{const b=e.target.closest('button');if(b)setTheme(b.dataset.t)};
$('#s_defStyle').innerHTML=STYLES.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
$('#b_style').innerHTML='<option value="">Style pour toutes…</option>'+STYLES.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
function fillSet(){const s=S.set;$('#s_dens').value=s.dens;$('#s_sort').value=s.sort;$('#s_defStyle').value=s.defStyle;$('#s_def24').value=s.def24?'1':'0';['bg','head','favicon','title'].forEach(k=>$('#s_'+k).checked=!!s[k])}
st.onchange=e=>{if(!e.target.id.startsWith('s_'))return;const s=S.set;
 s.dens=$('#s_dens').value;s.sort=$('#s_sort').value;s.defStyle=$('#s_defStyle').value;s.def24=$('#s_def24').value==='1';['bg','head','favicon','title'].forEach(k=>s[k]=$('#s_'+k).checked);
 applySet();save();render()};
const bulk=f=>{S.clocks.forEach(f);save();render();toast('✔ Appliqué à toutes les horloges')};
$('#b24').onclick=()=>bulk(c=>c.h24=true);$('#b12').onclick=()=>bulk(c=>c.h24=false);
$('#bsec').onclick=()=>{const v=!S.clocks.every(c=>c.sec);bulk(c=>c.sec=v)};
$('#bdate').onclick=()=>{const v=!S.clocks.every(c=>c.date);bulk(c=>c.date=v)};
$('#b_style').onchange=e=>{const v=e.target.value;if(v)bulk(c=>c.style=v);e.target.value=''};
$('#bexp').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,(k,v)=>k[0]==='_'?undefined:v,1)],{type:'application/json'}));a.download='talcotime-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
$('#bimp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{S=fix(JSON.parse(t));save();boot();toast('✔ Sauvegarde importée')}catch(x){toast('❌ Fichier invalide')}});e.target.value=''};
$('#breset').onclick=()=>{if(confirm('Tout réinitialiser (horloges, favoris, modèles) ?')){S=fix(null);save();boot()}};
$('#cfg').onclick=()=>{fillSet();st.showModal()};$('#sx').onclick=()=>st.close();
[gal,st].forEach(d=>d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close()}));

/* PWA */
let dp;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;$('#inst').hidden=true};
addEventListener('appinstalled',()=>$('#inst').hidden=true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

function boot(){setZoom(S.zoom);setTheme(S.theme);applySet();fillSet();render()}
boot();requestAnimationFrame(tick);
</script>
</body>
</html>
